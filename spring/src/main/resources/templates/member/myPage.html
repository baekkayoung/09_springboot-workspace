<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layout}"
layout:fragment="content">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="content">
    <br><br>
    <div class="innerOuter">
        <h2>마이페이지</h2>
        <br>

        <form action="update.me" method="post">
            <div class="form-group">
                <label for="userId">* ID :</label>
                <input type="text" class="form-control" id="userId" name="userId" value="" readonly th:value="${session.loginUser.userId}"><br>

                <label for="userName">* Name :</label>
                <input type="text" class="form-control" id="userName" name="userName" value="" readonly th:value="${session.loginUser.userName}"><br>

                <label for="email"> &nbsp; Email :</label>
                <input type="email" class="form-control" id="email" name="email" value=""th:value="${session.loginUser.email}"><br>

                <label for="age"> &nbsp; Age :</label>
                <input type="number" class="form-control" id="age" name="age" value="" th:value="${session.loginUser.age}"><br>

                <label for="phone"> &nbsp; Phone :</label>
                <input type="tel" class="form-control" id="phone" name="phone" value="" th:value="${session.loginUser.phone}"><br>

                <label for="address"> &nbsp; Address :</label>
                <input type="text" class="form-control" id="address" name="address" value="" th:value="${session.loginUser.address}"><br>

                <label for=""> &nbsp; Gender : </label> &nbsp;&nbsp;
                <input type="radio" name="gender" id="Male" value="M" >
                <label for="Male">남자</label> &nbsp;&nbsp;
                <input type="radio" name="gender" id="Female" value="F">
                <label for="Female">여자</label><br>

                <th:block th:if="${session.loginUser.gender != null}">
                    <script th:inline="javascript">
                        $(function(){
                            let gender = [[${session.loginUser.gender}]]
                            if(gender === 'M'){
                                $("#Male").prop("checked",true);
                            }else{
                                $("#Female").prop("checked",true);
                                }
                        })

                    </script>
                </th:block>

            </div>
            <br>
            <div class="btns" align="center">
                <button type="submit" class="btn btn-primary">수정하기</button>
                <button type="button" class="btn btn-danger" data-toggle="modal" data-target="#deleteForm">회원탈퇴</button>
            </div>
        </form>

    </div>
    <br><br>
</div>

<!-- 회원탈퇴 버튼 클릭시 보여질 Modal -->
<div class="modal" id="deleteForm">
    <div class="modal-dialog">
        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">
                <h4 class="modal-title">회원탈퇴</h4>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>

            <!-- Modal body -->
            <div class="modal-body" align="center">

                <b>
                    탈퇴 후 복구가 불가능합니다. <br>
                    정말로 탈퇴 하시겠습니까?
                </b>

                <form action="delete.me" method="post">
                    비밀번호 :
                    <input type="password" name="userPwd" required>
                    <button type="submit" class="btn btn-danger">탈퇴하기</button>
                </form>

            </div>

        </div>
    </div>
</div>
</body>
</html>
